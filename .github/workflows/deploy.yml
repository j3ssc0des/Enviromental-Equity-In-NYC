name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 11 * * 1"
  workflow_dispatch:

# Required for Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; don't cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Outbound internet access to data.cityofnewyork.us is required
    # for the live NYC Open Data API fetch; GitHub-hosted runners allow this.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Audit upstream schemas
        run: python3 .skillshare/skills/audit-nyc-environment-data/scripts/audit_sources.py

      - name: Generate map
        env:
          ALLOW_DEMO_DATA: "false"
        run: python3 nyc_trees_analysis.py

      - name: Validate build
        run: python3 scripts/validate_build.py

      - name: Test grounded AI endpoint contract
        run: npm test

      - name: Stage site files
        run: |
          mkdir _site
          cp index.html nyc_trees_map.html _site/
          cp -R assets docs data _site/

      - name: Configure optional AI endpoint
        env:
          ATLAS_AI_ENDPOINT: ${{ vars.ATLAS_AI_ENDPOINT }}
        run: python3 scripts/write_ai_config.py _site/data/ai-config.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
